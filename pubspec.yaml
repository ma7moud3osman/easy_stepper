name: easy_stepper

description: Guide users step by step. A fully customizable, beautiful and
  easy-to-use Flutter stepper to show progress or collect information in
  organized steps.

version: 1.2.0

homepage: https://github.com/ma7moud3osman
repository: https://github.com/ma7moud3osman/easy_stepper.git
issue_tracker: https://github.com/ma7moud3osman/easy_stepper/issues

screenshots:
  - description: "Easy Stepper logo."
    path: doc/icon.png

environment:
  sdk: ">=2.16.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
